<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: mây che tỉnh sương mù</title>
<link rel="stylesheet" href="../public/style.css">
<style>
@font-face { font-family: "Nunito"; src: url("../public/fonts/nunito.ttf") format("truetype"); font-weight: 200 1000; }
html, body { height: auto; }
.picker { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 24px; background: #fff; border-bottom: 2px solid var(--line); }
.picker h1 { color: var(--green); font-size: 20px; font-weight: 900; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-weight: 800; font-size: 14px; }
.seg button { font: 800 14px var(--font); padding: 5px 12px; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue-dark); color: #fff; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 24px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
.stage { position: relative; height: min(72vh, 640px); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.side h2 { margin-bottom: 6px; }
.side p { margin: 6px 0; font-size: 15px; }
.side .note { color: var(--muted); font-size: 14px; }
.side .btn { width: 100%; margin-top: 10px; }

.t { stroke: #fff; stroke-width: 3.2px; stroke-linejoin: round; fill-rule: evenodd; vector-effect: non-scaling-stroke; }
.lbl { font: 800 6.5px var(--font); text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 2px; stroke-linejoin: round; fill: var(--ink); }
.lbl.fogged { fill: #8A99A6; }
.lbl.on-color { fill: #fff; stroke: rgba(0, 0, 0, .3); }
.full .lbl { font-size: 20px; stroke-width: 5px; }
.fx { transform-box: fill-box; transform-origin: center; }

/* A · mây cục: nhấp nhô chậm */
@keyframes bob { 50% { transform: translateY(-1.2px); } }
.cloud-a { animation: bob 5s ease-in-out infinite; transform-box: fill-box; }
.full .cloud-a { animation-name: bob-full; }
@keyframes bob-full { 50% { transform: translateY(-3px); } }
/* C · mây trôi */
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(var(--d)); } }
.drift { animation: drift var(--t) linear infinite; }
@media (prefers-reduced-motion: reduce) { .cloud-a, .drift { animation: none; } }
</style>
</head>
<body>
<header class="picker">
  <h1>Mockup: mây che tỉnh sương mù</h1>
  <div class="seg" role="group" aria-label="Phương án" id="tabs"></div>
  <div class="seg" role="group" aria-label="Khung nhìn" id="views">Khung:
    <button type="button" data-view="near" aria-pressed="true">Gần (miền Bắc)</button>
    <button type="button" data-view="full">Cả nước</button>
  </div>
</header>

<main class="wrap">
  <section class="card map-wrap stage" id="stage"></section>
  <aside class="card side">
    <h2 id="vName"></h2>
    <p id="vText"></p>
    <p class="note" id="vNote"></p>
    <button class="btn green" type="button" id="reveal"><span data-ic="scout"></span> Tan sương: Tuyên Quang + Lạng Sơn</button>
    <button class="btn" type="button" id="cover"><span data-ic="fog"></span> Phủ mây lại</button>
    <p class="note">Tình huống: đội đỏ ở Hà Nội (đã chiếm Hà Nội, Phú Thọ). Tỉnh giáp ranh hiện màu miền, còn lại là sương mù.</p>
  </aside>
</main>

<script src="map-data.js"></script>

const D = window.MAP_DATA
const P = new Map(D.provinces.map(p => [p.id, p]))
const ids = D.provinces.map(p => p.id)
const rings = d => d.split('M').filter(Boolean).map(seg => seg.replace('Z', '').split('L').map(xy => xy.split(',').map(Number)))
const ringSize = pts => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) }
const noise = (x, y, s) => Math.sin(x * .11 + s) * Math.cos(y * .13 + s * 1.7) + .6 * Math.sin((x - y) * .23 + s * 2.3) + .25 * Math.sin(x * 1.3 + y * .9 + s)
const wob = d => rings(d).map(pts => { const a = Math.min(1.3, ringSize(pts) * .06); return pts.map(([x, y]) => [x + a * noise(x, y, 1), y + a * noise(y + 7, x - 3, 5)]) })
const R = new Map(ids.map(id => [id, wob(P.get(id).d)]))
const dOf = id => R.get(id).map(r => 'M' + r.map(q => q.map(v => v.toFixed(1)).join(',')).join('L') + 'Z').join('')
const big = id => R.get(id).filter(r => ringSize(r) > 12).map(r => 'M' + r.map(q => q.map(v => v.toFixed(1)).join(',')).join('L') + 'Z').join('')
const area = id => { let a = 0; for (const r of R.get(id)) for (let i = 0; i < r.length; i++) { const [x1, y1] = r[i], [x2, y2] = r[(i + 1) % r.length]; a += x1 * y2 - x2 * y1 } return Math.abs(a / 2) }
const bbox = id => { const pts = R.get(id).flat(); const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] }

// Đám mây chuẩn (đơn vị): các hình tròn + đáy bo
const CLOUD = [[-.55, .1, .38], [-.15, -.2, .5], [.35, -.05, .43], [.7, .17, .3], [0, .2, .36]]
const cloudShapes = (cx, cy, s, extra = '') => CLOUD.map(([x, y, r]) => `<circle cx="${(cx + x * s).toFixed(2)}" cy="${(cy + y * s).toFixed(2)}" r="${(r * s).toFixed(2)}"${extra}/>`).join('')
  + `<rect x="${(cx - .9 * s).toFixed(2)}" y="${(cy + .02 * s).toFixed(2)}" width="${(1.85 * s).toFixed(2)}" height="${(.5 * s).toFixed(2)}" rx="${(.25 * s).toFixed(2)}"${extra}/>`
// Mây sticker: bóng giấy → mép trắng → bụng xanh xám → mặt trên sáng
function cloudSticker(cx, cy, s, cls = 'cloud-a', delay = 0) {
  const rim = Math.max(.6, s * .14)
  return `<g class="${cls}" style="animation-delay:${delay}s" data-cx="${cx}" data-cy="${cy}">`
    + `<g fill="#AFC0CE" transform="translate(${s * .06} ${s * .16})">${cloudShapes(cx, cy, s)}</g>`
    + `<g fill="#fff" stroke="#fff" stroke-width="${rim * 2}">${cloudShapes(cx, cy, s)}</g>`
    + `<g fill="#DCE6EE">${cloudShapes(cx, cy, s)}</g>`
    + `<g fill="#F7FAFC">${cloudShapes(cx, cy - s * .1, s * .9)}</g></g>`
}
// Vị trí đặt mây trong tỉnh: tâm nhãn + vài điểm phụ cho tỉnh lớn (lấy từ khung bao, kiểm tra nằm trong tỉnh)
const svgPt = (() => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); return s })()
function inside(id, x, y) {
  let c = false
  for (const r of R.get(id)) for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j]
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c
  }
  return c
}
function cloudSpots(id) {
  const a = area(id), [x0, y0, x1, y1] = bbox(id), [lx, ly] = P.get(id).label
  const s = Math.max(view === 'full' ? 12 : 6, Math.min(view === 'full' ? 30 : 18, Math.sqrt(a) * .36))
  const spots = [[lx, ly - s * .25, s]]
  if (a > 900) {
    for (const [fx, fy] of [[.28, .3], [.72, .65], [.3, .75], [.7, .28]]) {
      const x = x0 + (x1 - x0) * fx, y = y0 + (y1 - y0) * fy
      if (inside(id, x, y) && spots.every(([sx, sy]) => Math.hypot(sx - x, sy - y) > s * 1.8)) spots.push([x, y, s * .72])
      if (spots.length >= 3) break
    }
  }
  return spots
}

// ---------- Vẽ ----------
function build() {
  const [vx, vy, vw, vh] = VIEW[view]
  const stage = document.getElementById('stage')
  let s = `<svg viewBox="${vx} ${vy} ${vw} ${vh}" preserveAspectRatio="xMidYMid meet" class="${view === 'full' ? 'full' : ''}">`
  s += `<defs><clipPath id="fogClip">${ids.filter(fogged).map(id => `<path data-id="${id}" d="${dOf(id)}"/>`).join('')}</clipPath></defs>`
  s += `<g transform="translate(0 ${view === 'full' ? 4 : 2.6})">${ids.map(id => `<path d="${big(id)}" fill="#8CCBEA" stroke="#8CCBEA" stroke-width="12" ${NSS}/>`).join('')}</g>`
  s += ids.map(id => `<path d="${big(id)}" fill="#fff" stroke="#fff" stroke-width="12" ${NSS}/>`).join('')
  // tỉnh (màu thật) — sương mù phủ lên trên
  s += `<g>${ids.map(id => `<path class="t" d="${dOf(id)}" fill="${tileFill(id)}"/>`).join('')}</g>`
  s += `<g id="fog">${fogLayer()}</g>`
  s += `<g>${ids.filter(id => P.get(id).label).map(id => {
    const [x, y] = P.get(id).label
    return `<text class="lbl${fogged(id) ? ' fogged' : OWN.has(id) ? ' on-color' : ''}" data-id="${id}" x="${x}" y="${y + 2}">${P.get(id).name}</text>`
  }).join('')}</g>`
  const [hx, hy] = P.get('ha-noi').label
  const hs = view === 'full' ? .9 : .42
  s += `<g transform="translate(${hx} ${hy - 9 * hs / .42}) scale(${hs})"><path d="M-12 3 Q-2 -16 0 -16 Q2 -16 12 3 Q0 7 -12 3 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M-12 3 Q-2 -16 0 -16 Q2 -16 12 3 Q0 7 -12 3 Z" fill="#FFC800" stroke="#B7791F" stroke-width="1.5"/></g>`
  stage.innerHTML = s + '</svg>'
}

function fogLayer() {
  const F = ids.filter(fogged)
  if (variant === 'cur') return F.map(id => `<path class="t fx" data-id="${id}" d="${dOf(id)}" fill="#D5DEE6"/>`).join('')
  if (variant === 'a') {
    let s = F.map(id => `<path class="t fx" data-id="${id}" d="${dOf(id)}" fill="#DCE5EC"/>`).join('')
    s += F.map((id, i) => `<g class="fx" data-cloud="${id}">${cloudSpots(id).map(([x, y, sz], j) => cloudSticker(x, y, sz, 'cloud-a', -((i * 1.3 + j * .7) % 5))).join('')}</g>`).join('')
    return s
  }
  if (variant === 'b') {
    // Mép mây phồng: chuỗi hình tròn dọc viền mỗi tỉnh sương mù (vẽ dưới mặt mây → chỉ phần ló ra ngoài vùng sương là thấy)
    const k = view === 'full' ? 1.7 : 1
    const bumps = id => R.get(id).filter(r => ringSize(r) > 10).map(r => {
      let d = '', acc = 0
      for (let i = 0; i < r.length; i++) {
        const [x, y] = r[i], [px, py] = r[(i + r.length - 1) % r.length]
        acc += Math.hypot(x - px, y - py)
        if (acc < 3.2 * k) continue
        acc = 0
        const rr = (2.3 + 1.1 * (noise(x * 3, y * 3, 2) * .5 + .5)) * k
        d += `M${(x - rr).toFixed(1)} ${y.toFixed(1)}a${rr.toFixed(1)} ${rr.toFixed(1)} 0 1 0 ${(2 * rr).toFixed(1)} 0a${rr.toFixed(1)} ${rr.toFixed(1)} 0 1 0 ${(-2 * rr).toFixed(1)} 0`
      }
      return d
    }).join('')
    let s = F.map(id => `<g class="fx" data-bump="${id}"><path d="${bumps(id)}" fill="#B9C9D6" transform="translate(0 ${1.4 * k})"/><path d="${bumps(id)}" fill="#fff" stroke="#fff" stroke-width="${1.6 * k}"/></g>`).join('')
    s += F.map(id => `<path class="fx" data-id="${id}" d="${dOf(id)}" fill="#EEF3F7" stroke="#EEF3F7" stroke-width="${2.2 * k}" stroke-linejoin="round"/>`).join('')
    // ranh giới tỉnh trong vùng mây: nét mờ
    s += F.map(id => `<path class="fx" data-line="${id}" d="${dOf(id)}" fill="none" stroke="#D3DEE7" stroke-width="1.2" ${NSS}/>`).join('')
    // vài cụm mây nổi nhẹ trong tỉnh lớn
    s += F.filter(id => area(id) > 700).map(id => { const [x, y] = P.get(id).label; const sz = Math.min(9, Math.sqrt(area(id)) * .16) * (view === 'full' ? 1.4 : 1)
      return `<g class="fx" data-puff="${id}" opacity=".9"><g fill="#fff">${cloudShapes(x + sz * 1.2, y - sz * 1.4, sz)}</g><g fill="#F7FAFC">${cloudShapes(x + sz * 1.2, y - sz * 1.5, sz * .9)}</g></g>` }).join('')
    return s
  }
  // C: nền xám phẳng + mây lớn trôi trong vùng sương (cắt theo hình tỉnh)
  let s = F.map(id => `<path class="t fx" data-id="${id}" d="${dOf(id)}" fill="#D5DEE6"/>`).join('')
  const [vx, vy, vw, vh] = VIEW[view]
  const sz = view === 'full' ? 46 : 22
  let clouds = ''
  for (let i = 0; i < 14; i++) {
    const x = vx + ((i * 0.37) % 1) * vw - vw * .3, y = vy + ((i * 0.61 + .1) % 1) * vh
    const t = 38 + (i % 4) * 9
    clouds += `<g class="drift" style="--d:${vw * .9}px;--t:${t}s;animation-delay:${-i * 6}s"><g fill="#fff" opacity=".85">${cloudShapes(x, y, sz * (.8 + (i % 3) * .25))}</g></g>`
  }
  s += `<g clip-path="url(#fogClip)" id="driftLayer">${clouds}</g>`
  return s
}

// ---------- Tan sương / phủ lại ----------
async function reveal() {
  const st = document.getElementById('stage')
  const anims = []
  for (const id of REVEAL) {
    if (!fogged(id)) continue
    const tile = st.querySelector(`#fog [data-id="${id}"]`)
    if (variant === 'a') {
      const g = st.querySelector(`[data-cloud="${id}"]`)
      anims.push(g.animate([{ transform: 'translateY(0) scale(1)', opacity: 1 }, { transform: 'translateY(-4px) scale(1.15)', opacity: 1, offset: .35 }, { transform: 'translateY(-16px) scale(1.4)', opacity: 0 }], { duration: 750, easing: 'ease-in', fill: 'forwards' }))
      anims.push(tile.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, delay: 250, fill: 'forwards' }))
    } else if (variant === 'b') {
      for (const sel of [`[data-bump="${id}"]`, `[data-puff="${id}"]`]) { const g = st.querySelector(sel); if (g) anims.push(g.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.92)', opacity: 0 }], { duration: 600, easing: 'ease-in', fill: 'forwards' })) }
      anims.push(tile.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, delay: 150, fill: 'forwards' }))
      anims.push(st.querySelector(`[data-line="${id}"]`).animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }))
    } else {
      anims.push(tile.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, fill: 'forwards' }))
    }
    const l = st.querySelector(`.lbl[data-id="${id}"]`)
    l.classList.remove('fogged')
    l.classList.add('fx')
    l.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)', offset: .4 }, { transform: 'scale(1)' }], { duration: 500, delay: 300, easing: 'cubic-bezier(.3, 1.6, .5, 1)' })
  }
  if (variant === 'c') for (const id of REVEAL) st.querySelector(`#fogClip [data-id="${id}"]`)?.remove()
  await Promise.all(anims.map(a => a.finished))
  REVEAL.forEach(id => seen.add(id))
  build()
}
function cover() { seen = new Set(SEEN0); build() }

function setVariant(v) {
  variant = v
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)))
  const [n, t, note] = VARIANTS[v]
  document.getElementById('vName').textContent = n
  document.getElementById('vText').textContent = t
  document.getElementById('vNote').textContent = note
  try { localStorage.setItem('fog-variant', v) } catch {}
  build()
}
document.getElementById('tabs').innerHTML = 'Phương án: ' + Object.entries(VARIANTS).map(([v, [n]], i) => `<button type="button" data-v="${v}">${i} · ${n.replace(/^[A-C] · /, '')}</button>`).join('')
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setVariant(b.dataset.v)))
document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view
  document.querySelectorAll('#views button').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
  build()
}))
document.addEventListener('keydown', e => { const v = ['cur', 'a', 'b', 'c'][e.key]; if (v) setVariant(v) })
document.getElementById('reveal').addEventListener('click', reveal)
document.getElementById('cover').addEventListener('click', cover)
const q = new URLSearchParams(location.search)
if (q.get('view') === 'full') { view = 'full'; document.querySelectorAll('#views button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === 'full'))) }
let start = q.get('v')
try { start ??= localStorage.getItem('fog-variant') } catch {}
setVariant(VARIANTS[start] ? start : 'a')
</script>
