<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng xếp hạng · Hành trình 3 miền</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/rules.css">
<link rel="stylesheet" href="/css/leaderboard.css">
<script type="module" src="/leaderboard.js"></script>
</head>
<body class="rules-page lb-page">
<!-- Bộ lọc vẽ tay (css/hand.css) -->
<svg class="hand-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="hand-wob-s" x="-20%" y="-60%" width="140%" height="220%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="hand-wob2" x="-20%" y="-60%" width="140%" height="220%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="hand-ic-wob" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="1" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<header class="rules-top">
  <div class="rules-title">
    <span data-icon="trophy"></span>
    <div><h1>Bảng xếp hạng lữ khách</h1><p class="muted">Phòng chơi đơn · cả sự kiện · cộng dồn điểm mọi trận</p></div>
    <a class="btn green" href="/">Vào chơi</a>
  </div>
</header>

<main class="lb">
  <p class="lb-summary muted" id="summary"></p>
  <div class="podium" id="podium"></div>
  <div class="lb-tools" hidden>
    <input class="input" id="search" type="search" placeholder="Tìm tên của bạn" aria-label="Tìm tên">
  </div>
  <div class="results-board" id="board" hidden>
    <table class="results-table lb-table">
      <thead><tr><th>#</th><th>Lữ khách</th><th>Điểm</th><th>Tem</th><th>Số trận</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="lb-empty card" id="empty" hidden>
    <span data-icon="map"></span>
    <p><b>Chưa có trận chơi đơn nào kết thúc.</b></p>
    <p class="muted">Vào một phòng chơi đơn, chơi hết trận là có tên ở đây.</p>
    <a class="btn green" href="/">Vào chơi</a>
  </div>
  <p class="hint muted" id="hint"></p>
</main>
</body>
</html>
